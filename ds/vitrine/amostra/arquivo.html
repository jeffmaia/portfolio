.peca { display: grid; gap: var(--space-16); padding-top: var(--space-32); }

.palco { display: grid; gap: var(--space-12); }
.palco__barra { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-8) var(--space-16); }

html:not(.js) .palco__larguras { display: none; }
.palco__janela {

  border: var(--stroke) solid var(--border);

.amostra__rolar { min-height: 60vh; }
.amostra__vazio { display: grid; place-items: center; min-height: 360px; border-radius: var(--radius); background: var(--muted); color: var(--ink); font-size: var(--text-apoio); }
.ficha-pagina__palco { display: grid; gap: var(--space-16); }
.ficha-pagina__palco > h2 { font-size: var(--text-lead); font-weight: 700; line-height: 1.3; }
.testar { display: grid; gap: var(--space-8); padding-left: 1.2em; list-style: disc; font-size: var(--text-apoio); max-width: var(--leitura); }

.palco-pagina > div { display: grid; gap: var(--space-32); }
.links-soltos { display: flex; flex-wrap: wrap; gap: var(--space-8) var(--space-24); }
.ficha-pagina { display: grid; gap: var(--space-32); padding-block: var(--space-32) var(--space-secao); }

.doc { display: grid; gap: var(--space-16); max-width: 820px; }

.doc .tabela { overflow-x: auto; border: var(--stroke) solid var(--border); border-radius: var(--radius); }
.doc table { width: 100%; border-collapse: collapse; font-size: var(--text-apoio); }
.doc th, .doc td { padding: var(--space-8) var(--space-12); border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.doc tr:last-child td { border-bottom: 0; }
.doc th { background: var(--muted); font-size: var(--text-rotulo); letter-spacing: var(--tracking-rotulo); text-transform: uppercase; }
.doc pre { overflow-x: auto; padding: var(--space-16); border: var(--stroke) solid var(--border); border-radius: var(--radius); background: var(--muted); font-size: 13px; line-height: 1.5; }
code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .9em; }

    <figure class="arquivo" data-revelar>
  <div class="arquivo__corpo"><div class="arquivo__componente"><img src="../../../assets/casos/design-system/modal-claro-escuro.png" alt="O Modal do design system no tema claro e no escuro, com o título primário na faixa de cima, o título secundário, o texto e dois botões, um secundário e um primário em amarelo." width="1198" height="451" loading="lazy" decoding="async"></div><div class="arquivo__doc"><p class="arquivo__barra"><span class="arquivo__nome">modal.md</span><span class="badge">Reconstituição</span></p><pre class="arquivo__texto"><b># Modal</b>

Sobreposição que interrompe o fluxo principal para mostrar uma informação ou pedir uma ação importante, como uma confirmação ou um formulário curto.

<b>## Quando usar</b>
- A pessoa precisa decidir ou preencher algo antes de seguir.
- O conteúdo extra é curto e não pede rolar a página de trás.

<b>## Não use quando</b>
- A ação é destrutiva e só pede sim ou não. Use Confirmation Dialog.
- É um aviso que não interrompe nada. Use Toast.

<b>## Anatomia</b>
1. Título primário, na faixa de cima, com o botão de fechar.
2. Título secundário e texto, o componente Título e subtítulo.
3. Ações, um botão secundário e um primário, nessa ordem.
4. Backdrop com 70% de transparência, sempre.

<b>## Comportamento</b>
- A altura acompanha o conteúdo. A largura vai até 680px.
- O botão de fechar é sempre o Tertiary em color‑fixed‑white.
- Esc e o clique no backdrop fecham, e o foco volta para quem abriu.
- As cores vêm do componente e não mudam.

<b>## Responsividade</b>
- Mobile. Largura da tela com 16px de margem, ações empilhadas.
- Tablet. Centralizado, na largura do conteúdo.
- Desktop. Centralizado, até 680px.</pre></div></div>
