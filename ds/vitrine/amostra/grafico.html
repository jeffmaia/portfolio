<!DOCTYPE html>
<html lang="pt-BR" data-acento="azul">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.classList.add("js");try{if(performance.getEntriesByType("navigation")[0].type==="back_forward")document.documentElement.classList.add("volta")}catch(e){}</script>
<title>Gráfico · Amostra da vitrine</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='3' y='3' width='94' height='94' rx='14' fill='%23edfe5e' stroke='%23000' stroke-width='6'/%3E%3Ctext x='50' y='74' font-family='Impact, Anton, sans-serif' font-size='62' text-anchor='middle' fill='%23000'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../../../assets/ds/tokens.css">
<link rel="stylesheet" href="../../../assets/ds/componentes.css">
<style>
.peca { display: grid; gap: var(--space-16); padding-top: var(--space-32); }
.peca + .peca { margin-top: var(--space-32); border-top: var(--stroke) solid var(--border); }
.peca > h3 { font-size: var(--text-lead); line-height: 1.3; }
.palco { display: grid; gap: var(--space-12); }
.palco__barra { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-8) var(--space-16); }
.palco__larguras { display: flex; gap: var(--space-8); }
html:not(.js) .palco__larguras { display: none; }
.palco__janela {
  height: 640px;
  overflow: hidden;
  border: var(--stroke) solid var(--border);
  border-radius: var(--radius);
  background: var(--background);
  transition: width var(--dur-media) var(--ease-troca), height var(--dur-media) var(--ease-troca);
}
.palco__janela iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  transform-origin: 0 0;
  transition: transform var(--dur-media) var(--ease-troca);
}
.amostra { display: grid; gap: var(--space-48); padding-block: var(--space-32) var(--space-48); }
.amostra__item { display: grid; gap: var(--space-16); container-type: inline-size; }
.amostra__nome { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-8) var(--space-12); }
.amostra__tinta { display: grid; gap: var(--space-24); padding: var(--space-32); border-radius: var(--radius); }
.amostra__fileira { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-16) var(--space-32); }
.amostra__rolar { min-height: 60vh; }
.amostra__vazio { display: grid; place-items: center; min-height: 360px; border-radius: var(--radius); background: var(--muted); color: var(--ink); font-size: var(--text-apoio); }
.ficha-pagina__palco { display: grid; gap: var(--space-16); }
.ficha-pagina__palco > h2 { font-size: var(--text-lead); font-weight: 700; line-height: 1.3; }
.testar { display: grid; gap: var(--space-8); padding-left: 1.2em; list-style: disc; font-size: var(--text-apoio); max-width: var(--leitura); }

.palco-pagina { padding-block: var(--space-32) var(--space-secao); }
.palco-pagina > div { display: grid; gap: var(--space-32); }
.links-soltos { display: flex; flex-wrap: wrap; gap: var(--space-8) var(--space-24); }
.ficha-pagina { display: grid; gap: var(--space-32); padding-block: var(--space-32) var(--space-secao); }
.ficha-pagina__topo { display: grid; gap: var(--space-16); justify-items: start; }
.ficha-pagina__topo .t-sub { max-width: 40ch; }
.doc { display: grid; gap: var(--space-16); max-width: 820px; }
.doc h2 { font-size: var(--text-lead); font-weight: 700; line-height: 1.3; margin-top: var(--space-24); }
.doc ul, .doc ol { display: grid; gap: var(--space-8); padding-left: 1.4em; }
.doc ul { list-style: disc; }
.doc ol { list-style: decimal; }
.doc .tabela { overflow-x: auto; border: var(--stroke) solid var(--border); border-radius: var(--radius); }
.doc table { width: 100%; border-collapse: collapse; font-size: var(--text-apoio); }
.doc th, .doc td { padding: var(--space-8) var(--space-12); border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.doc tr:last-child td { border-bottom: 0; }
.doc th { background: var(--muted); font-size: var(--text-rotulo); letter-spacing: var(--tracking-rotulo); text-transform: uppercase; }
.doc pre { overflow-x: auto; padding: var(--space-16); border: var(--stroke) solid var(--border); border-radius: var(--radius); background: var(--muted); font-size: 13px; line-height: 1.5; }
code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .9em; }
:not(pre) > code { padding: 1px 5px; border-radius: 4px; background: var(--muted); }
</style>
</head>
<body>

<main id="conteudo" class="container amostra">
  <div class="amostra__item">
    <p class="amostra__nome"><span class="t-rotulo">Barras, um par, no azul do Mapa</span><code>data-variant="barras"</code></p>
    <div data-acento="azul"><figure class="chart" data-variant="barras" data-revelar>
  <figcaption class="t-rotulo">Usuários únicos no primeiro mês</figcaption>
  <div class="chart__grupos"><div class="chart__grupo"><dl class="chart__linhas"><div class="chart__linha"><dt class="chart__rotulo">Sem o mapa de experiência</dt><dd class="chart__valor">20</dd><dd class="chart__trilho" aria-hidden="true"><span class="chart__preenche" data-tom="trama" style="--valor: 2.2"></span></dd></div><div class="chart__linha"><dt class="chart__rotulo">Com o mapa de experiência</dt><dd class="chart__valor">890</dd><dd class="chart__trilho" aria-hidden="true"><span class="chart__preenche" data-tom="cheio" style="--valor: 100"></span></dd></div></dl></div></div>
</figure></div>
  </div>
  <div class="amostra__item">
    <p class="amostra__nome"><span class="t-rotulo">Barras, dois pares, no lime do Processo</span><code>data-variant="barras"</code></p>
    <div data-acento="lime"><figure class="chart" data-variant="barras" data-revelar>
  <figcaption class="t-rotulo">Tempo antes e depois</figcaption>
  <div class="chart__grupos"><div class="chart__grupo"><h3 class="chart__nome">Discovery</h3><dl class="chart__linhas"><div class="chart__linha"><dt class="chart__rotulo">Antes</dt><dd class="chart__valor">1 a 2 meses</dd><dd class="chart__trilho" aria-hidden="true"><span class="chart__preenche" data-tom="trama" style="--valor: 100"></span></dd></div><div class="chart__linha"><dt class="chart__rotulo">Depois</dt><dd class="chart__valor"><span aria-hidden="true">~</span><span class="sr">cerca de </span>1 semana</dd><dd class="chart__trilho" aria-hidden="true"><span class="chart__preenche" data-tom="cheio" style="--valor: 12.5"></span></dd></div></dl></div><div class="chart__grupo"><h3 class="chart__nome">Refinamento semanal</h3><dl class="chart__linhas"><div class="chart__linha"><dt class="chart__rotulo">Antes</dt><dd class="chart__valor">4 a 5 h</dd><dd class="chart__trilho" aria-hidden="true"><span class="chart__preenche" data-tom="trama" style="--valor: 100"></span></dd></div><div class="chart__linha"><dt class="chart__rotulo">Depois</dt><dd class="chart__valor">30 a 40 min</dd><dd class="chart__trilho" aria-hidden="true"><span class="chart__preenche" data-tom="cheio" style="--valor: 13"></span></dd></div></dl></div></div>
</figure></div>
  </div>
  <div class="amostra__item">
    <p class="amostra__nome"><span class="t-rotulo">Pilhas, com a legenda, no verde do Inpulse</span><code>data-variant="pilhas"</code></p>
    <div data-acento="verde"><figure class="chart" data-variant="pilhas" data-revelar>
  <figcaption class="t-rotulo">Reações de 10 participantes, em seis das dez funcionalidades testadas</figcaption>
  <dl class="chart__legenda"><div><dt><span class="chart__amostra" data-tom="cheio" aria-hidden="true"></span>Entusiasta</dt><dd>Demonstra interesse de maneira espontânea.</dd></div><div><dt><span class="chart__amostra" data-tom="trama" aria-hidden="true"></span>Receptivo</dt><dd>Demonstra interesse a partir de uma interação ou pergunta do&nbsp;facilitador.</dd></div><div><dt><span class="chart__amostra" data-tom="vazio" aria-hidden="true"></span>Indiferente</dt><dd>Verbaliza a falta de interesse, ou ignora que a funcionalidade&nbsp;existe.</dd></div></dl>
  <ol class="chart__pilhas"><li class="chart__pilha"><p class="chart__nome">Próximas avaliações</p><div class="chart__trilho" aria-hidden="true"><span class="chart__parte" data-tom="trama" style="--n: 8"></span><span class="chart__parte" data-tom="vazio" style="--n: 2"></span></div><p class="chart__conta">8 receptivos · 2 indiferentes</p></li><li class="chart__pilha"><p class="chart__nome">Faltas</p><div class="chart__trilho" aria-hidden="true"><span class="chart__parte" data-tom="trama" style="--n: 10"></span></div><p class="chart__conta">10 receptivos</p></li><li class="chart__pilha"><p class="chart__nome">Situação atual</p><div class="chart__trilho" aria-hidden="true"><span class="chart__parte" data-tom="cheio" style="--n: 1"></span><span class="chart__parte" data-tom="trama" style="--n: 9"></span></div><p class="chart__conta">1 entusiasta · 9 receptivos</p></li><li class="chart__pilha"><p class="chart__nome">Últimas avaliações</p><div class="chart__trilho" aria-hidden="true"><span class="chart__parte" data-tom="cheio" style="--n: 1"></span><span class="chart__parte" data-tom="trama" style="--n: 8"></span><span class="chart__parte" data-tom="vazio" style="--n: 1"></span></div><p class="chart__conta">1 entusiasta · 8 receptivos · 1 indiferente</p></li><li class="chart__pilha"><p class="chart__nome">Calendário</p><div class="chart__trilho" aria-hidden="true"><span class="chart__parte" data-tom="cheio" style="--n: 3"></span><span class="chart__parte" data-tom="trama" style="--n: 7"></span></div><p class="chart__conta">3 entusiastas · 7 receptivos</p></li><li class="chart__pilha"><p class="chart__nome">Planejar estudos</p><div class="chart__trilho" aria-hidden="true"><span class="chart__parte" data-tom="cheio" style="--n: 1"></span><span class="chart__parte" data-tom="trama" style="--n: 8"></span><span class="chart__parte" data-tom="vazio" style="--n: 1"></span></div><p class="chart__conta">1 entusiasta · 8 receptivos · 1 indiferente</p></li></ol>
</figure></div>
  </div>
  <div class="amostra__item">
    <p class="amostra__nome"><span class="t-rotulo">Escala, no azul do Mapa</span><code>data-variant="escala"</code></p>
    <div data-acento="azul"><figure class="chart" data-variant="escala" style="--antes: -33; --depois: 15" data-revelar>
  <figcaption class="t-rotulo">Nota geral de NPS<span class="sr">, numa escala de −100 a +100</span></figcaption>
  <div class="chart__escala">
    <p class="chart__marco" data-ponto="antes"><span class="chart__numero">−33</span><span class="t-rotulo">Antes</span></p>
    <p class="chart__marco" data-ponto="depois"><span class="chart__numero">+15</span><span class="t-rotulo">Depois</span></p>
    <div class="chart__eixo" aria-hidden="true"><span class="chart__percurso"></span><span class="chart__zero"></span><span class="chart__ponto" data-ponto="antes"></span><span class="chart__ponto" data-ponto="depois"></span></div>
    <p class="chart__regua t-rotulo" aria-hidden="true"><span>−100</span><span>0</span><span>+100</span></p>
  </div>
</figure></div>
  </div>
</main>
<script src="../../../assets/ds/componentes.js"></script>
</body>
</html>
